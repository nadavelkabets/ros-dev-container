# Aligned with the ament_flake8 conventions ROS 2 packages are tested with
line-length = 99

[lint]
select = [
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "N",  # pep8-naming
  "Q",  # flake8-quotes
  "UP",  # pyupgrade
  "W",  # pycodestyle warnings
]
ignore = [
  "UP031",  # printf-style formatting is common in ROS code, including ros2 pkg create's tests
]

[lint.flake8-quotes]
inline-quotes = "single"

[lint.isort]
# Approximates flake8-import-order's google style, which ament_flake8 enforces
force-sort-within-sections = true
order-by-type = false
case-sensitive = false

[format]
quote-style = "single"
